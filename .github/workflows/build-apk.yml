name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: SDK, NDK, CMake
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Unit tests
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: PS3MobilePlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
